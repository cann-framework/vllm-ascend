name: Dispatcher-Smoke
on:
  workflow_dispatch:
    inputs:
      probe_pr:
        description: Disposable approval probe PR
        required: true
        type: string
      probe_sha:
        description: Exact disposable PR head SHA
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
jobs:
  verify-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Approve and dismiss the disposable PR review
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_PR: ${{ inputs.probe_pr }}
          PROBE_SHA: ${{ inputs.probe_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROBE_PR" =~ ^[0-9]+$ && "$PROBE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PROBE_PR" > /tmp/probe-pr.json
          jq -e --arg sha "$PROBE_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.state == "open" and .user.login == "depeng1994" and .head.sha == $sha and .head.repo.full_name == $repo and (.title | startswith("[DO NOT MERGE] Approval probe"))' \
            /tmp/probe-pr.json >/dev/null
          gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$PROBE_PR/reviews" \
            -f event=APPROVE -f commit_id="$PROBE_SHA" > /tmp/probe-review.json
          review_id=$(jq -er '.id' /tmp/probe-review.json)
          trap 'gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PROBE_PR/reviews/$review_id/dismissals" -f message="End of controlled approval test" >/dev/null || true' EXIT
          jq -e --arg sha "$PROBE_SHA" '.user.login == "github-actions[bot]" and .state == "APPROVED" and .commit_id == $sha' /tmp/probe-review.json >/dev/null
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PROBE_PR/reviews/$review_id/dismissals" -f message='End of controlled approval test' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PROBE_PR/reviews/$review_id" --jq '{id,state,commit_id,user:.user.login}'
          trap - EXIT
